name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/git-dates.mjs reads commit history to date posts that have
          # no `date` in frontmatter. A shallow clone would give every post the
          # same date.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a known-vulnerable dependency. Nothing here ships to
      # the browser, but the build toolchain is still worth keeping clean, and
      # a fork that ignores Dependabot would otherwise never find out.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # scripts/github-profile.mjs is unauthenticated without this, and the
          # anonymous API allows 60 requests an hour per IP — shared across every
          # runner on the hosted pool. The default job token raises it to 5000.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
